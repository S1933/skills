skill: cdsv2
description: Use when authoring, reviewing, testing, troubleshooting, or migrating
  OVH CDSv2 workflow, action, worker-model, template, gate, matrix, service, or expression
  YAML.
cases:
- name: positive 1
  prompt: Fix this CDSv2 workflow matrix and gate expression.
  tags:
  - positive
  expected:
    should_trigger: true
- name: positive 2
  prompt: 'Please help: Fix this CDSv2 workflow matrix and gate expression.'
  tags:
  - positive
  expected:
    should_trigger: true
- name: positive 3
  prompt: In this repository, Fix this CDSv2 workflow matrix and gate expression.
  tags:
  - positive
  expected:
    should_trigger: true
- name: positive 4
  prompt: Before changing anything, Fix this CDSv2 workflow matrix and gate expression.
  tags:
  - positive
  expected:
    should_trigger: true
- name: positive 5
  prompt: I need an agent to Fix this CDSv2 workflow matrix and gate expression.
  tags:
  - positive
  - ambiguous
  expected:
    should_trigger: true
- name: collision with related skill
  prompt: Convert this GitHub Actions workflow to another GitHub workflow.
  tags:
  - negative
  - collision
  expected:
    should_trigger: false
- name: conceptual explanation only
  prompt: Explain what a unit test is without changing any repository.
