skill: ovhcloud-smoke-tests
description: Use when OVHcloud smoke-test patterns fail literal HTML matching or the
  locale-specific pattern catalogue needs updating.
cases:
- name: positive 1
  prompt: Update the OVHcloud smoke-test literal HTML patterns for this locale failure.
  tags:
  - positive
  expected:
    should_trigger: true
- name: positive 2
  prompt: 'Please help: Update the OVHcloud smoke-test literal HTML patterns for this
    locale failure.'
  tags:
  - positive
  expected:
    should_trigger: true
- name: positive 3
  prompt: In this repository, Update the OVHcloud smoke-test literal HTML patterns
    for this locale failure.
  tags:
  - positive
  expected:
    should_trigger: true
- name: positive 4
  prompt: Before changing anything, Update the OVHcloud smoke-test literal HTML patterns
    for this locale failure.
  tags:
  - positive
  expected:
    should_trigger: true
- name: positive 5
  prompt: I need an agent to Update the OVHcloud smoke-test literal HTML patterns
    for this locale failure.
  tags:
  - positive
  - ambiguous
  expected:
    should_trigger: true
- name: collision with related skill
  prompt: Write a generic browser end-to-end test.
  tags:
  - negative
  - collision
  expected:
    should_trigger: false
- name: conceptual explanation only
  prompt: Explain what a unit test is without changing any repository.
  tags:
  - negative
  expected:
    should_trigger: false
- name: copy edit only
  prompt: Proofread this paragraph for grammar and punctuation.
  tags:
  - negative
  expected:
    should_trigger: false
- name: unrelated status query
  prompt: Summarize the current Git branch name and stop.
  tags:
  - negative
  expected:
    should_trigger: false
- name: ambiguous unrelated request
  prompt: Can you take a quick look and explain what this file does?
  tags:
  - negative
  - ambiguous
  expected:
    should_trigger: false
